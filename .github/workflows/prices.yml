name: 株価の取得

on:
  schedule:
    - cron: "45 7 * * 1-5"   # 月〜金 16:45 JST（UTC 7:45）
  workflow_dispatch:          # Actions 画面から手動でも実行できる

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas xlrd curl_cffi
      - run: python scripts/fetch_prices.py
      - name: 保存（変更があればコミット）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "株価を更新 $(TZ=Asia/Tokyo date +%Y/%m/%d)"
          git push
