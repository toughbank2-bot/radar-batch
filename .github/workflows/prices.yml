name: 株価の取得

on:
  schedule:
    - cron: "45 7 * * 1-5"   # 月〜金 16:45 JST（UTC 7:45）
  workflow_dispatch:          # Actions 画面から手動でも実行できる

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests xlrd
      - run: python scripts/fetch_prices.py
      - name: 保存（変更があればコミット）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices_all.json
          git diff --cached --quiet || git commit -m "株価を更新 $(TZ=Asia/Tokyo date +%Y/%m/%d)"
          git push
