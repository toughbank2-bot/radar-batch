name: 財務指標の取得

on:
  schedule:
    - cron: "40 12 * * 6"   # 毎週土曜 21:40 JST（UTC 12:40）
  workflow_dispatch:          # Actions 画面から手動でも実行できる

permissions:
  contents: write

jobs:
  fundamentals:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas curl_cffi
      - run: python scripts/fetch_fundamentals.py
      - name: 保存（変更があればコミット）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "財務指標を更新 $(TZ=Asia/Tokyo date +%Y/%m/%d)"
          git pull --rebase
          git push
